<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임상 수혈 전용 계산기</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --blood: #be123c;
      --blood-soft: #fff1f2;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warn: #d97706;
      --warn-soft: #fffbeb;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 16px 48px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-left { display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 1.05rem; font-weight: 700; color: var(--primary); }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--blood-soft);
      color: var(--blood);
    }

    .nav-links { display: flex; gap: 6px; }
    .nav-link {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    .nav-link:hover { background: #f1f5f9; }
    .nav-link.active {
      color: var(--blood);
      border-color: var(--blood);
      background: var(--blood-soft);
    }

    .content { padding: 20px; }

    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .obs-banner {
      background: var(--blood-soft);
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--blood);
      line-height: 1.45;
    }
    .obs-banner strong { font-weight: 700; }

    /* 수혈 세트(DF) 선택 박스 */
    .df-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .df-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .df-chip {
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text-main);
      cursor: pointer;
    }
    .df-chip.active {
      border-color: var(--blood);
      color: var(--blood);
      background: var(--blood-soft);
    }

    .df-custom-input {
      width: 64px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      outline: none;
    }
    .df-custom-input:focus { border-color: var(--blood); }

    /* 혈액 제제 선택 그리드 */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .prod-btn {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .prod-btn strong { display: block; font-size: 0.9rem; color: var(--primary); }
    .prod-btn span { font-size: 0.74rem; color: var(--text-muted); }
    .prod-btn.active { border-color: var(--blood); background: var(--blood-soft); }
    .prod-btn.active strong { color: var(--blood); }

    /* I/O 설정 박스 */
    .sub-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .io-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      overflow: hidden;
    }
    .input-row:focus-within {
      border-color: var(--blood);
      box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.08);
    }
    .input-row input {
      flex: 1;
      border: none;
      padding: 10px 12px;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--primary);
      outline: none;
      width: 100%;
    }

    .unit-tag {
      padding: 0 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: #f8fafc;
      border-left: 1px solid var(--border);
      align-self: stretch;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .qty-chips {
      display: none;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap;
    }
    .qty-chips.show { display: flex; }

    .io-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .io-ref-text { font-size: 0.74rem; color: var(--text-muted); }
    .btn-group { display: flex; gap: 6px; }

    .mini-btn {
      padding: 5px 9px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-main);
    }
    .mini-btn.save { background: var(--primary); color: #fff; border-color: var(--primary); }

    .total-io-bar {
      margin-top: 10px;
      padding: 9px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
    }
    .total-io-bar strong { color: var(--blood); font-size: 0.95rem; }

    /* 시간 선택 버튼 */
    .quick-chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .chip-btn {
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:hover { border-color: var(--blood); color: var(--blood); }
    .chip-btn.active { border-color: var(--blood); color: var(--blood); background: var(--blood-soft); }

    .time-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }

    /* 양방향 속도 입력 카드 */
    .rate-hint {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .rate-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      transition: border-color 0.15s;
    }
    .rate-card:focus-within {
      border-color: var(--blood);
      background: var(--card);
    }
    .rate-card label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .rate-card input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary);
      outline: none;
    }
    .rate-card span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 2단계 실전 투여 스케줄 박스 */
    .schedule-box {
      background: var(--accent-soft);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 14px;
      font-size: 0.81rem;
      color: var(--primary);
      line-height: 1.55;
    }
    .schedule-box h4 { font-size: 0.84rem; color: var(--accent); margin-bottom: 6px; }
    .pack-schedule-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #93c5fd;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .pack-item {
      background: var(--card);
      border: 1px solid #dbeafe;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pack-item strong { color: var(--accent); }

    /* 경고 배너 */
    .alert-box {
      display: none;
      margin-bottom: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .alert-danger { background: var(--danger-soft); border: 1px solid #fecaca; color: var(--danger); }
    .alert-warn { background: var(--warn-soft); border: 1px solid #fde68a; color: var(--warn); }

    /* 임상 프로토콜 카드 */
    .guide-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--text-main);
    }
    .guide-card h3 { font-size: 0.86rem; color: var(--primary); margin-bottom: 8px; }
    .guide-card ul { padding-left: 16px; }
    .guide-card li { margin-bottom: 5px; }
    .common-rule {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-left">
        <h1>수혈 전용 계산기</h1>
        <span id="df-badge" class="badge">DF 15</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">기본형</a>
        <a href="pro.html" class="nav-link">Pro</a>
        <a href="transfusion.html" class="nav-link active">수혈</a>
      </div>
    </header>

    <div class="content">
      <div id="obs-banner" class="obs-banner"></div>

      <!-- 수혈 필터 세트(DF) 선택 및 커스텀 저장 -->
      <div class="df-box">
        <span class="section-label">수혈 필터 세트 규격 (Drop Factor, 기본 15 gtt/mL)</span>
        <div class="df-row">
          <button class="df-chip" data-df="15" onclick="setBloodDF(15)">15 gtt</button>
          <button class="df-chip" data-df="20" onclick="setBloodDF(20)">20 gtt</button>
          <button class="df-chip" data-df="10" onclick="setBloodDF(10)">10 gtt</button>
          <input type="number" id="custom-df-input" class="df-custom-input" min="1" placeholder="직접" oninput="onCustomDFInput()" />
          <button class="mini-btn save" onclick="saveHospitalDF()">내 병원 세트 저장</button>
        </div>
      </div>

      <span class="section-label">1. 혈액 제제 선택 (유래 전혈 기준)</span>
      <div class="product-grid" id="product-grid"></div>

      <div class="sub-box">
        <span class="section-label">2. 1팩 용량 (병원 I/O 기준 수정 가능) &amp; 수량</span>
        <div class="io-row">
          <div class="input-row">
            <input type="number" id="pack-vol" step="any" min="1" oninput="calcTransfusion('time')" />
            <span class="unit-tag">mL / 팩</span>
          </div>
          <div class="input-row">
            <input type="number" id="pack-qty" step="1" min="1" value="1" oninput="onQtyManualInput()" />
            <span class="unit-tag">팩 (Unit)</span>
          </div>
        </div>

        <!-- PC 선택 시 모드별 원터치 버튼 (8팩 제거, 풀링 추가) -->
        <div id="pc-qty-chips" class="qty-chips">
          <button class="chip-btn" data-mode="dose6" onclick="setPCMode('dose6')">6팩 (1 dose)</button>
          <button class="chip-btn" data-mode="dose5" onclick="setPCMode('dose5')">5팩 (1 dose)</button>
          <button class="chip-btn" data-mode="pack" onclick="setPCMode('pack')">1팩 단독</button>
          <button class="chip-btn" data-mode="pool" onclick="setPCMode('pool')">풀링 1백 (300mL)</button>
        </div>

        <div class="io-actions">
          <span id="io-ref-text" class="io-ref-text"></span>
          <div class="btn-group">
            <button class="mini-btn save" onclick="saveHospitalIO()">내 병원 I/O 저장</button>
            <button class="mini-btn" onclick="resetHospitalIO()">공식 복원</button>
          </div>
        </div>

        <div class="total-io-bar">
          <span>총 수혈량 (I/O 기록 참고)</span>
          <strong id="total-vol-display">190 mL</strong>
        </div>
      </div>

      <span id="time-section-label" class="section-label">3. 목표 수혈 시간 설정</span>
      <div class="quick-chips" id="time-chips"></div>

      <div class="time-inputs">
        <div class="input-row">
          <input type="number" id="dur-hr" min="0" value="2" oninput="calcTransfusion('time')" />
          <span class="unit-tag">시간</span>
        </div>
        <div class="input-row">
          <input type="number" id="dur-min" min="0" max="59" value="0" oninput="calcTransfusion('time')" />
          <span class="unit-tag">분</span>
        </div>
      </div>

      <div class="rate-hint">💡 아래 속도나 방울 간격을 직접 입력하면 소요 시간이 자동 역산됩니다.</div>
      <div class="result-grid">
        <div class="rate-card">
          <label for="in-ml">전체 평균 속도</label>
          <input type="number" id="in-ml" step="any" min="0" oninput="calcTransfusion('ml')" />
          <span>cc/hr</span>
        </div>
        <div class="rate-card">
          <label for="in-gtt">평균 방울 수</label>
          <input type="number" id="in-gtt" step="any" min="0" oninput="calcTransfusion('gtt')" />
          <span>gtt/min</span>
        </div>
        <div class="rate-card">
          <label for="in-sec">평균 방울 간격</label>
          <input type="number" id="in-sec" step="any" min="0" oninput="calcTransfusion('sec')" />
          <span>초당 1방울</span>
        </div>
      </div>

      <!-- 첫 15분 관찰 반영 실전 2단계 스케줄 -->
      <div id="schedule-box" class="schedule-box" style="display:none;"></div>

      <div id="tf-alert" class="alert-box"></div>

      <div id="guide-card" class="guide-card"></div>
    </div>
  </div>

  <script>
    const CUSTOM_IO_KEY = "nurse_calc_blood_io_v1";
    const CUSTOM_DF_KEY = "nurse_calc_blood_df_v1";

    let currentDF = parseFloat(localStorage.getItem(CUSTOM_DF_KEY)) || 15;
    let pcMode = "dose6"; // 'dose6', 'dose5', 'pack', 'pool'

    // 제제 및 PC 모드별로 완전히 분리된 시간 버튼
    const TIME_PRESETS = {
      PRBC: [
        { label: "2시간 (권장)", hr: 2, min: 0 },
        { label: "1시간 30분", hr: 1, min: 30 },
        { label: "3시간", hr: 3, min: 0 },
        { label: "4시간 (최대)", hr: 4, min: 0 }
      ],
      FFP: [
        { label: "1시간 (권장)", hr: 1, min: 0 },
        { label: "30분", hr: 0, min: 30 },
        { label: "2시간", hr: 2, min: 0 },
        { label: "3시간 (실온 최대)", hr: 3, min: 0 }
      ],
      PC_dose: [
        { label: "1시간 (1 dose 권장)", hr: 1, min: 0 },
        { label: "45분", hr: 0, min: 45 },
        { label: "30분", hr: 0, min: 30 },
        { label: "1시간 30분", hr: 1, min: 30 }
      ],
      PC_pack: [
        { label: "5분", hr: 0, min: 5 },
        { label: "8분", hr: 0, min: 8 },
        { label: "10분 (권장)", hr: 0, min: 10 },
        { label: "15분", hr: 0, min: 15 },
        { label: "30분", hr: 0, min: 30 }
      ],
      PC_pool: [
        { label: "1시간 (풀링 권장)", hr: 1, min: 0 },
        { label: "45분", hr: 0, min: 45 },
        { label: "30분", hr: 0, min: 30 },
        { label: "1시간 30분", hr: 1, min: 30 },
        { label: "2시간", hr: 2, min: 0 }
      ]
    };

    const PRODUCTS = [
      { id: "prbc320", type: "PRBC", name: "PRBC 320mL", defaultVol: 190, refRange: "공식 참고: 190±20 mL", defaultQty: 1, defaultHr: 2, defaultMin: 0 },
      { id: "prbc400", type: "PRBC", name: "PRBC 400mL", defaultVol: 250, refRange: "공식 참고: 250±25 mL", defaultQty: 1, defaultHr: 2, defaultMin: 0 },
      { id: "pc320", type: "PC", name: "PC 320mL", defaultVol: 40, refRange: "공식 참고: 40±5 mL (풀링 200~300mL)", defaultQty: 6, defaultHr: 1, defaultMin: 0 },
      { id: "pc400", type: "PC", name: "PC 400mL", defaultVol: 50, refRange: "공식 참고: 50±5 mL (풀링 200~300mL)", defaultQty: 6, defaultHr: 1, defaultMin: 0 },
      { id: "ffp320", type: "FFP", name: "FFP 320mL", defaultVol: 150, refRange: "공식 참고: 150±30 mL 이상", defaultQty: 1, defaultHr: 1, defaultMin: 0 },
      { id: "ffp400", type: "FFP", name: "FFP 400mL", defaultVol: 174, refRange: "공식 참고: 174±29 mL 이상", defaultQty: 1, defaultHr: 1, defaultMin: 0 }
    ];

    const GUIDES = {
      PRBC: {
        title: "PRBC (농축적혈구) 성인 수혈 가이드",
        items: [
          "<strong>권장 시간:</strong> 첫 15분 50 mL/hr 관찰 후 부작용이 없으면 나머지 용량을 <strong>2시간 이내</strong> 투여합니다.",
          "<strong>최대 허용 시간:</strong> 실온 출고 후 <strong>최대 4시간 이내</strong> 완료해야 합니다. (세균 증식 및 용혈/오염 위험)",
          "<strong>고령·심부전·신부전:</strong> 순환과부하(TACO) 위험을 고려해 의사 처방과 환자 상태에 따라 속도를 조절하되 4시간을 넘기지 않습니다."
        ]
      },
      PC: {
        title: "PC (농축혈소판 · 풀링혈소판) 성인 수혈 가이드",
        items: [
          "<strong>권장 시간:</strong> <strong>1 dose(5~6팩) 또는 풀링 1백 = 30분~1시간(공식 60분)</strong> 내외로 투여합니다.",
          "<strong>풀링(Pooled PC) 기준:</strong> 5~6팩을 큰 백 1개(약 200~300mL)로 합친 제제이며, <strong>풀링 시점부터 최대 4시간 이내</strong>에 완료해야 합니다.",
          "<strong>임상 연속 투여법:</strong> 첫 15분간 50 mL/hr 관찰 후 이상이 없으면, 일반 팩은 <strong>팩당 5~10분</strong> 간격으로 연속 투여합니다. (냉장 보관 금지)"
        ]
      },
      FFP: {
        title: "FFP (신선동결혈장) 성인 수혈 가이드",
        items: [
          "<strong>권장 수혈 시간:</strong> 1단위당 <strong>약 1시간(60분)</strong> 내외로 투여합니다.",
          "<strong>해동 후 보관 기준:</strong> 실온 보관 시 <strong>3시간 이내</strong> 사용 권장, 1~6℃ 냉장 보관 시 <strong>24시간 이내</strong> 수혈 완료.",
          "<strong>주의사항:</strong> 응고인자 활성 저하 방지를 위해 해동 후 가급적 빠르게 투여하며 TACO 및 TRALI(급성폐손상)를 관찰합니다."
        ]
      }
    };

    let currentProd = PRODUCTS[0];

    function fmt(num, digits = 1) {
      if (!isFinite(num) || isNaN(num)) return "";
      return parseFloat(num.toFixed(digits));
    }

    // ==================== 수혈 세트 DF 관리 ====================
    function updateDFUI() {
      document.getElementById("df-badge").textContent = `DF ${currentDF}`;
      document.getElementById("time-section-label").textContent = `3. 목표 수혈 시간 설정 (수혈 세트 ${currentDF} gtt/mL 기준)`;
      document.getElementById("custom-df-input").value = currentDF;

      document.querySelectorAll(".df-chip").forEach(btn => {
        btn.classList.toggle("active", parseFloat(btn.dataset.df) === currentDF);
      });

      const obsGtt = (50 * currentDF) / 60;
      const obsSec = 60 / obsGtt;
      document.getElementById("obs-banner").innerHTML = `
        <strong>성인 수혈 첫 15분 관찰 속도:</strong> <strong>50 mL/hr</strong> (현재 ${currentDF} gtt/mL 세트 기준 약 <strong>${fmt(obsGtt, 1)} gtt/min</strong>, ${fmt(obsSec, 1)}초당 1방울)로 천천히 주입하며 급성 부작용을 확인합니다.
      `;

      calcTransfusion("time");
    }

    function setBloodDF(df) { currentDF = df; updateDFUI(); }
    function onCustomDFInput() {
      const val = parseFloat(document.getElementById("custom-df-input").value);
      if (isFinite(val) && val > 0) { currentDF = val; updateDFUI(); }
    }
    function saveHospitalDF() {
      if (!isFinite(currentDF) || currentDF <= 0) return;
      localStorage.setItem(CUSTOM_DF_KEY, String(currentDF));
      alert(`내 병원 수혈 세트 규격이 ${currentDF} gtt/mL로 저장되었습니다.`);
    }

    // ==================== 제제 & 모드 관리 ====================
    function getCustomIO() {
      try { return JSON.parse(localStorage.getItem(CUSTOM_IO_KEY)) || {}; }
      catch { return {}; }
    }

    function renderProducts() {
      const grid = document.getElementById("product-grid");
      const custom = getCustomIO();
      grid.innerHTML = PRODUCTS.map(p => {
        const vol = custom[p.id] ?? p.defaultVol;
        const isCustom = custom[p.id] !== undefined;
        return `
          <button class="prod-btn ${p.id === currentProd.id ? "active" : ""}" onclick="selectProduct('${p.id}')">
            <strong>${p.name}</strong>
            <span>${vol} mL ${isCustom ? "(병원저장)" : ""}</span>
          </button>
        `;
      }).join("");
    }

    function renderTimeChips() {
      let key = currentProd.type;
      if (currentProd.type === "PC") {
        if (pcMode === "pack") key = "PC_pack";
        else if (pcMode === "pool") key = "PC_pool";
        else key = "PC_dose";
      }
      const chips = TIME_PRESETS[key];
      document.getElementById("time-chips").innerHTML = chips.map(c => {
        const totalMin = c.hr * 60 + c.min;
        return `<button class="chip-btn" data-min="${totalMin}" onclick="setDuration(${c.hr}, ${c.min})">${c.label}</button>`;
      }).join("");
    }

    function selectProduct(id) {
      currentProd = PRODUCTS.find(p => p.id === id);
      const custom = getCustomIO();
      document.getElementById("pack-vol").value = custom[id] ?? currentProd.defaultVol;
      document.getElementById("pack-qty").value = currentProd.defaultQty;
      document.getElementById("io-ref-text").textContent = currentProd.refRange;

      const isPC = currentProd.type === "PC";
      document.getElementById("pc-qty-chips").classList.toggle("show", isPC);
      if (isPC) pcMode = "dose6";

      renderProducts();
      renderTimeChips();
      renderGuide();
      setDuration(currentProd.defaultHr, currentProd.defaultMin);
    }

    function setPCMode(mode) {
      pcMode = mode;
      const custom = getCustomIO();
      const baseVol = custom[currentProd.id] ?? currentProd.defaultVol;

      if (mode === "dose6") {
        document.getElementById("pack-vol").value = baseVol;
        document.getElementById("pack-qty").value = 6;
        renderTimeChips();
        setDuration(1, 0);
      } else if (mode === "dose5") {
        document.getElementById("pack-vol").value = baseVol;
        document.getElementById("pack-qty").value = 5;
        renderTimeChips();
        setDuration(1, 0);
      } else if (mode === "pack") {
        document.getElementById("pack-vol").value = baseVol;
        document.getElementById("pack-qty").value = 1;
        renderTimeChips();
        setDuration(0, 10);
      } else if (mode === "pool") {
        document.getElementById("pack-vol").value = 300;
        document.getElementById("pack-qty").value = 1;
        renderTimeChips();
        setDuration(1, 0);
      }
    }

    function onQtyManualInput() {
      if (currentProd.type === "PC") {
        const q = parseInt(document.getElementById("pack-qty").value, 10) || 1;
        if (q === 6) pcMode = "dose6";
        else if (q === 5) pcMode = "dose5";
        else if (q === 1 && parseFloat(document.getElementById("pack-vol").value) >= 150) pcMode = "pool";
        else if (q === 1) pcMode = "pack";
        else pcMode = "dose6";
        renderTimeChips();
      }
      calcTransfusion("time");
    }

    function saveHospitalIO() {
      const vol = parseFloat(document.getElementById("pack-vol").value);
      if (!isFinite(vol) || vol <= 0) return;
      const custom = getCustomIO();
      custom[currentProd.id] = vol;
      localStorage.setItem(CUSTOM_IO_KEY, JSON.stringify(custom));
      renderProducts();
      alert(`${currentProd.name}의 내 병원 I/O 용량이 ${vol} mL로 저장되었습니다.`);
    }

    function resetHospitalIO() {
      const custom = getCustomIO();
      delete custom[currentProd.id];
      localStorage.setItem(CUSTOM_IO_KEY, JSON.stringify(custom));
      document.getElementById("pack-vol").value = currentProd.defaultVol;
      renderProducts();
      calcTransfusion("time");
    }

    function setDuration(hr, min) {
      document.getElementById("dur-hr").value = hr;
      document.getElementById("dur-min").value = min;
      calcTransfusion("time");
    }

    function renderGuide() {
      const g = GUIDES[currentProd.type];
      document.getElementById("guide-card").innerHTML = `
        <h3>${g.title}</h3>
        <ul>${g.items.map(i => `<li>${i}</li>`).join("")}</ul>
        <div class="common-rule">
          <strong>• V/S 측정 간격:</strong> 시작 직전 → 시작 후 15분 → 수혈 중(30분~1시간마다) → 완료 시 → 완료 후 1시간 이내<br>
          <strong>• 라인 원칙:</strong> 0.9% 생리식염수(NS)만 병용 가능 (DW·H/S·타 약물 절대 혼합 금지). 전처치 약물은 과거 부작용 병력 및 주치의 처방에 따라 선별 투여.
        </div>
      `;
    }

    // ==================== 양방향 계산 (시간 ↔ 속도/방울/초) ====================
    function calcTransfusion(source) {
      const packVol = parseFloat(document.getElementById("pack-vol").value);
      const qty = parseInt(document.getElementById("pack-qty").value, 10) || 1;
      const totalVol = isFinite(packVol) && packVol > 0 ? packVol * qty : 0;

      document.getElementById("total-vol-display").textContent =
        totalVol > 0 ? `${fmt(totalVol, 1)} mL (${pcMode === "pool" && currentProd.type === "PC" ? "풀링 1백" : `${qty}팩`})` : "-";

      // PC 모드 칩 활성화 표시
      document.querySelectorAll("#pc-qty-chips .chip-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === pcMode);
      });

      const hrEl = document.getElementById("dur-hr");
      const minEl = document.getElementById("dur-min");
      const mlEl = document.getElementById("in-ml");
      const gttEl = document.getElementById("in-gtt");
      const secEl = document.getElementById("in-sec");
      const alertEl = document.getElementById("tf-alert");
      const schedEl = document.getElementById("schedule-box");

      if (totalVol <= 0) {
        alertEl.style.display = "none";
        schedEl.style.display = "none";
        return;
      }

      let mlPerHr = NaN;
      let totalMin = NaN;

      if (source === "time") {
        const hr = parseFloat(hrEl.value) || 0;
        const min = parseFloat(minEl.value) || 0;
        totalMin = Math.round(hr * 60 + min);
        if (totalMin > 0) mlPerHr = totalVol / (totalMin / 60);
      } else if (source === "ml") {
        mlPerHr = parseFloat(mlEl.value);
      } else if (source === "gtt") {
        const g = parseFloat(gttEl.value);
        if (g > 0) mlPerHr = (g * 60) / currentDF;
      } else if (source === "sec") {
        const s = parseFloat(secEl.value);
        if (s > 0) mlPerHr = ((60 / s) * 60) / currentDF;
      }

      if (!isFinite(mlPerHr) || mlPerHr <= 0) {
        if (source !== "ml") mlEl.value = "";
        if (source !== "gtt") gttEl.value = "";
        if (source !== "sec") secEl.value = "";
        alertEl.style.display = "none";
        schedEl.style.display = "none";
        return;
      }

      const gttPerMin = (mlPerHr * currentDF) / 60;
      const secPerGtt = 60 / gttPerMin;

      // 속도에서 역산한 경우 시간/분 자동 업데이트
      if (source !== "time") {
        totalMin = Math.round((totalVol / mlPerHr) * 60);
        hrEl.value = Math.floor(totalMin / 60);
        minEl.value = totalMin % 60;
      }

      if (source !== "ml") mlEl.value = fmt(mlPerHr, 1);
      if (source !== "gtt") gttEl.value = Math.round(gttPerMin);
      if (source !== "sec") secEl.value = fmt(secPerGtt, 2);

      // 시간 칩 활성화 표시
      document.querySelectorAll("#time-chips .chip-btn").forEach(btn => {
        btn.classList.toggle("active", parseInt(btn.dataset.min, 10) === totalMin);
      });

      // ==================== 실전 2단계 스케줄 계산 ====================
      let stage2Rate = mlPerHr;
      if (totalMin > 15 && totalVol > 12.5) {
        const first15Vol = 12.5;
        const remainVol = totalVol - first15Vol;
        const remainMin = totalMin - 15;
        stage2Rate = remainVol / (remainMin / 60);
        const stage2Gtt = (stage2Rate * currentDF) / 60;
        const stage2Sec = 60 / stage2Gtt;

        let schedHTML = `
          <h4>📋 첫 15분 관찰 반영 실전 스케줄</h4>
          • <strong>1단계 (0~15분):</strong> 50 cc/hr (12.5 mL 주입, 부작용 관찰)<br>
          • <strong>2단계 (15분~완료):</strong> <strong>${fmt(stage2Rate, 1)} cc/hr</strong> (${Math.round(stage2Gtt)} gtt/min, ${fmt(stage2Sec, 2)}초/1방울)
        `;

        if (qty > 1) {
          const mlPerMinStage2 = stage2Rate / 60;
          const pack1RemainVol = Math.max(0, packVol - first15Vol);
          const pack1Min = 15 + (pack1RemainVol / mlPerMinStage2);
          const otherPackMin = packVol / mlPerMinStage2;

          let itemsHTML = `<div class="pack-item"><span>1 Pack (관찰 포함)</span><strong>약 ${fmt(pack1Min, 1)}분</strong></div>`;
          for (let i = 2; i <= qty; i++) {
            itemsHTML += `<div class="pack-item"><span>${i} Pack</span><strong>약 ${fmt(otherPackMin, 1)}분</strong></div>`;
          }
          schedHTML += `<div class="pack-schedule-list">${itemsHTML}</div>`;
        }

        schedEl.innerHTML = schedHTML;
        schedEl.style.display = "block";
      } else {
        schedEl.innerHTML = `
          <h4>📋 단기/연속 투여 참고</h4>
          설정한 시간이 15분 이하입니다. <strong>첫 번째 팩은 반드시 15분간 50 cc/hr로 관찰</strong>한 뒤, 이상이 없을 때 다음 팩부터 위 속도로 연속 투여하세요.
        `;
        schedEl.style.display = "block";
      }

      // ==================== 제제별 안전 경고 로직 ====================
      alertEl.style.display = "none";
      if (currentProd.type === "PRBC") {
        if (totalMin > 240) {
          alertEl.className = "alert-box alert-danger";
          alertEl.style.display = "block";
          alertEl.textContent = "⚠️ 4시간 초과 불가: PRBC는 실온 노출 시 세균 증식 및 용혈/오염 위험으로 출고 후 4시간 이내에 완료해야 합니다.";
        } else if (totalMin < 90) {
          alertEl.className = "alert-box alert-warn";
          alertEl.style.display = "block";
          alertEl.textContent = "💡 급속 주입 주의 (1시간 30분 미만): 대량 출혈 상황이 아니라면 순환과부하(TACO) 위험을 반드시 확인하세요.";
        }
      } else if (currentProd.type === "FFP") {
        if (totalMin > 180) {
          alertEl.className = "alert-box alert-danger";
          alertEl.style.display = "block";
          alertEl.textContent = "⚠️ 실온 3시간 초과 주의: FFP는 해동 후 실온에서 3시간 이내 사용을 권장합니다. (냉장 보관 시 24시간 이내)";
        }
      } else if (currentProd.type === "PC") {
        if (totalMin > 240) {
          alertEl.className = "alert-box alert-danger";
          alertEl.style.display = "block";
          alertEl.textContent = "⚠️ 4시간 초과 불가: 혈소판(특히 풀링 제제)은 실온 보관 제제로 출고/풀링 후 최대 4시간 이내에 완료해야 합니다.";
        } else if ((qty >= 5 || pcMode === "pool") && stage2Rate > 450) {
          alertEl.className = "alert-box alert-danger";
          alertEl.style.display = "block";
          alertEl.textContent = `⚠️ 과속 주입 위험 (본 속도 ${fmt(stage2Rate, 0)} cc/hr): 첫 15분 관찰을 포함해 ${totalMin}분 안에 완료하는 것은 매우 빠릅니다. 순환과부하(TACO) 방지를 위해 1시간(60분) 설정을 권장합니다.`;
        } else if (totalMin > 90) {
          alertEl.className = "alert-box alert-warn";
          alertEl.style.display = "block";
          alertEl.textContent = "💡 혈소판 지연 투여 주의: 1 dose(5~6팩) 및 풀링 제제는 통상 30분~1시간(공식 60분) 내외로 지연 없이 투여하는 것을 권장합니다.";
        }
      }
    }

    // 초기 실행
    selectProduct("prbc320");
    updateDFUI();
  </script>
</body>
</html>
